services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: derechos_de_estudiantes_development
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "3000:3000"
    volumes:
      - ..:/app:cached
      - bundle:/usr/local/bundle

  db:
    image: postgres:13
    ports:
    - "5432:5432"
    environment:
      POSTGRES_DB: derechos_de_estudiantes_development
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d derechos_de_estudiantes_development" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  bundle:
  postgres-data:
